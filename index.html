<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><meta name="description" content="Thông tin chuyển khoản và ủng hộ ePlus.DEV"><title>BankHub · ePlus.DEV</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color-scheme:dark;--bg:#090f1c;--card:#111d30;--line:#26354b;--text:#edf4ff;--muted:#9aaec8;--accent:#6ba9ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#203c66 0,transparent 55%),var(--bg);color:var(--text)}main{max-width:780px;margin:auto;padding:32px 18px 70px}header{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:850;letter-spacing:-.5px}.brand span{color:var(--accent)}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.theme{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 13px}.hero{text-align:center;padding:50px 0 27px}.avatar{width:68px;height:68px;margin:auto;display:grid;place-items:center;background:linear-gradient(135deg,#4f8af4,#7a5aff);border-radius:22px;font-size:30px}.hero h1{font-size:clamp(28px,6vw,40px);margin:18px 0 8px;letter-spacing:-1px}.hero p{color:var(--muted);line-height:1.6;margin:0}.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:15px;color:var(--text);padding:15px 18px;margin:20px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.tab{border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--muted);padding:9px 16px}.tab.active{background:var(--accent);color:#081222;border-color:var(--accent);font-weight:700}.list{display:grid;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 12px 30px #0002}.cardhead{display:flex;align-items:center;gap:12px;margin-bottom:20px}.logo{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:#233955;font-size:23px;font-weight:800}.cardhead h2{font-size:18px;margin:0 0 4px}.cardhead p{color:var(--muted);font-size:13px;margin:0}.badge{margin-left:auto;background:#183d38;color:#8de0b4;padding:5px 9px;border-radius:20px;font-size:11px}.detail{background:#0c1727;border-radius:15px;padding:14px 16px;margin:10px 0}.label{font-size:12px;color:var(--muted);margin-bottom:7px}.value{display:flex;align-items:center;justify-content:space-between;gap:10px;overflow-wrap:anywhere}.value strong{font-size:17px}.copy{border:0;background:#233c60;color:#bcd9ff;padding:8px 12px;border-radius:9px;flex-shrink:0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.primary,.secondary{border-radius:12px;padding:12px 16px;text-decoration:none;font-weight:700;text-align:center;flex:1}.primary{background:var(--accent);color:#061425;border:0}.secondary{border:1px solid var(--line);background:transparent;color:var(--text)}.qr{display:none;text-align:center;padding:18px;margin-top:15px;background:white;border-radius:16px;color:#16243a}.qr img{width:220px;max-width:100%;height:auto}.qr small{display:block;margin-top:8px}.qr.open{display:block}.empty{text-align:center;color:var(--muted);padding:40px}.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:38px}.foot a{color:var(--accent)}.notice{color:var(--muted);font-size:13px;text-align:center;margin-top:12px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#d6f8e5;color:#06371d;border-radius:12px;padding:12px 18px;box-shadow:0 8px 30px #0006}.light{color-scheme:light;--bg:#f3f7fc;--card:#fff;--line:#dbe4f0;--text:#18283d;--muted:#53657d;--accent:#397ee6}.light .detail{background:#f2f6fc}.light .copy{background:#e2edff;color:#22518c}.light .logo{background:#e2edff}.light .tab.active{color:white}
</style></head><body><main><header><div class="brand">ePlus<span>.DEV</span> / BankHub</div><button class="theme" id="theme" aria-label="Đổi giao diện">☀︎</button></header><section class="hero"><div class="avatar">↗</div><h1>Payment & Donation</h1><p>Thông tin chuyển khoản trong một nơi.<br>Chọn tài khoản, sao chép hoặc quét VietQR.</p></section><input class="search" id="search" placeholder="⌕  Tìm ngân hàng hoặc tên tài khoản…" aria-label="Tìm tài khoản"><nav class="tabs" id="tabs" aria-label="Lọc tài khoản"><button class="tab active" data-filter="all">Tất cả</button><button class="tab" data-filter="bank">Ngân hàng</button><button class="tab" data-filter="wallet">Ví điện tử</button><button class="tab" data-filter="donate">Donate</button></nav><section id="list" class="list" aria-live="polite"></section><p class="notice">Chỉ chuyển khoản sau khi xác minh đúng tên người nhận trong ứng dụng ngân hàng.</p><footer class="foot">© <span id="year"></span> ePlus.DEV · Built for GitHub Pages · <a href="https://github.com/ePlus-DEV/bank">Source code</a></footer></main><div id="toast" class="toast" role="status" hidden></div><script>
/* © ePlus.DEV — Edit this public list to add verified receiving accounts.
   bankId: VietQR bank BIN or supported bank code. Never add login credentials. */
const accounts=[
 // Example only. Replace with real details before publishing.
 {id:"sample",category:"bank",bank:"Ngân hàng mẫu",bankId:"970436",name:"TEN CHU TAI KHOAN",number:"0000000000",note:"",featured:true,enabled:false}
];
const $=s=>document.querySelector(s);let filter="all";let query="";
const escapeHTML=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function notify(s){const t=$("#toast");t.textContent=s;t.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,2400)}
async function copy(s){try{await navigator.clipboard.writeText(s);notify("Đã sao chép!")}catch{const t=document.createElement("textarea");t.value=s;document.body.append(t);t.select();try{document.execCommand("copy");notify("Đã sao chép!")}catch{notify("Không thể sao chép trên trình duyệt này")}t.remove()}}
function qrUrl(a){const params=new URLSearchParams({accountName:a.name,addInfo:a.note||"",template:"compact2"});return "https://img.vietqr.io/image/"+encodeURIComponent(a.bankId)+"-"+encodeURIComponent(a.number)+".png?"+params}
function render(){const list=$("#list");list.replaceChildren();const data=accounts.filter(a=>a.enabled!==false&&(filter==="all"||a.category===filter)&&[a.bank,a.name,a.number].join(" ").toLowerCase().includes(query));if(!data.length){list.innerHTML='<div class="empty">Chưa có tài khoản phù hợp. Hãy cập nhật danh sách tài khoản trong source code.</div>';return}
for(const a of data){const card=document.createElement("article");card.className="card";const qr=a.bankId&&a.number?qrUrl(a):"";card.innerHTML='<div class="cardhead"><div class="logo">▣</div><div><h2>'+escapeHTML(a.bank)+'</h2><p>'+escapeHTML(a.category==="wallet"?"Ví điện tử":a.category==="donate"?"Ủng hộ dự án":"Chuyển khoản ngân hàng")+'</p></div>'+(a.featured?'<span class="badge">Ưu tiên</span>':"")+'</div><div class="detail"><div class="label">Số tài khoản</div><div class="value"><strong>'+escapeHTML(a.number)+'</strong><button class="copy" data-copy="number">Copy</button></div></div><div class="detail"><div class="label">Chủ tài khoản</div><div class="value"><strong>'+escapeHTML(a.name)+'</strong><button class="copy" data-copy="name">Copy</button></div></div>'+(a.note?'<div class="detail"><div class="label">Nội dung chuyển khoản</div><div class="value"><strong>'+escapeHTML(a.note)+'</strong><button class="copy" data-copy="note">Copy</button></div></div>':"")+'<div class="actions"><button class="primary" data-action="all">⧉ Copy tất cả</button>'+(qr?'<button class="secondary" data-action="qr">▦ Xem VietQR</button>':"")+'</div>'+(qr?'<div class="qr"><img alt="VietQR chuyển khoản" loading="lazy"><small>Quét mã bằng ứng dụng ngân hàng</small><a class="secondary" target="_blank" rel="noopener noreferrer">Mở / lưu QR</a></div>':"");card.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.copy)copy(a[b.dataset.copy]);if(b.dataset.action==="all")copy([a.bank,a.number,a.name,a.note].filter(Boolean).join("\n"));if(b.dataset.action==="qr"){const box=card.querySelector(".qr");box.classList.toggle("open");if(box.classList.contains("open")){box.querySelector("img").src=qr;box.querySelector("a").href=qr}}});list.append(card)}}
$("#search").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase();render()});$("#tabs").addEventListener("click",e=>{const b=e.target.closest("[data-filter]");if(!b)return;filter=b.dataset.filter;document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t===b));render()});$("#theme").addEventListener("click",()=>{document.documentElement.classList.toggle("light");localStorage.setItem("bank-theme",document.documentElement.classList.contains("light")?"light":"dark")});if(localStorage.getItem("bank-theme")==="light")document.documentElement.classList.add("light");$("#year").textContent=new Date().getFullYear();render();
</script></body></html>
